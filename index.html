            if (!drag) return;
            const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
            if (!drag.moved && Math.hypot(dx, dy) < 6) return;
            drag.moved = true;
            e.preventDefault();
            drag.ghost.style.left = `${e.clientX - drag.offsetX}px`;
            drag.ghost.style.top = `${e.clientY - drag.offsetY}px`;
            clearTargets();
            const under = document.elementFromPoint(e.clientX, e.clientY);
            const noteEl = under?.closest?.('.detected-note');
            if (!noteEl || noteEl.closest('.line-block')?.dataset.line !== String(lineIdx)) return;
            const groupIdx = parseInt(chip.dataset.group, 10);
            const noteId = noteEl.dataset.noteId;
            const group = state.lines[lineIdx]?.groups?.[groupIdx];
            if (group && groupDetectedIds(group).includes(noteId)) noteEl.classList.add('reverse-drop-target');
        };

        const finish = e => {
            if (!drag) return;
            const wasMoved = drag.moved;
            const under = document.elementFromPoint(e.clientX, e.clientY);
            const noteEl = under?.closest?.('.detected-note');
            const groupIdx = parseInt(chip.dataset.group, 10);
            const line = state.lines[lineIdx];
            const group = line?.groups?.[groupIdx];
            const validTarget = wasMoved && noteEl &&
                noteEl.closest('.line-block')?.dataset.line === String(lineIdx) &&
                group && groupDetectedIds(group).includes(noteEl.dataset.noteId);

            cleanup();
            if (wasMoved) suppressClick = true;
            if (validTarget) detachDetectedNote(lineIdx, noteEl.dataset.noteId, groupIdx);
            setTimeout(() => { suppressClick = false; }, 0);
        };

        chip.addEventListener('pointerdown', e => {
            if (e.button !== undefined && e.button !== 0) return;
            if (e.target.closest('.action-btn, .note-badge')) return;
            const line = state.lines[lineIdx];
            const groupIdx = parseInt(chip.dataset.group, 10);
            const group = line?.groups?.[groupIdx];
            if (!group || !groupDetectedIds(group).length) return;

            const r = chip.getBoundingClientRect();
            const ghost = chip.cloneNode(true);
            ghost.classList.add('group-drag-ghost');
            Object.assign(ghost.style, {
                position:'fixed', left:`${r.left}px`, top:`${r.top}px`, width:`${r.width}px`,
                margin:'0', pointerEvents:'none', zIndex:'9999'
            });
            document.body.appendChild(ghost);
            chip.classList.add('drag-source');
            e.preventDefault();
            e.stopPropagation();
            try { chip.setPointerCapture(e.pointerId); } catch (_) {}
            drag = {
                startX:e.clientX, startY:e.clientY,
                offsetX:e.clientX-r.left, offsetY:e.clientY-r.top,
                moved:false, ghost, pointerId:e.pointerId
            };
        });

        chip.addEventListener('pointermove', onMove);
        chip.addEventListener('pointerup', finish);
        chip.addEventListener('pointercancel', finish);
        chip.addEventListener('click', e => {
            if (suppressClick) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);
    }

    function renderDetectedNoteConnections(lineIdx, visual) {
        const line = state.lines[lineIdx];
        if (!line || line.notesCollapsed) return;
        const svg = visual.querySelector('.line-notes-connections');
        if (!svg) return;
        const box = visual.getBoundingClientRect();
        svg.setAttribute('viewBox', `0 0 ${Math.max(1, box.width)} ${Math.max(1, box.height)}`);
        svg.innerHTML = '';

        const links = [];
        (line.detectedNotes || []).forEach(n => {
            const noteEl = visual.querySelector(`.detected-note[data-note-id="${CSS.escape(n.id)}"]`);
            if (!noteEl) return;
            const groupIdxs = Array.isArray(n.groupIdxs) ? n.groupIdxs : (n.groupIdx != null ? [n.groupIdx] : []);
            groupIdxs.forEach(groupIdx => {
                const chip = visual.querySelector(`.chip[data-group="${groupIdx}"]`);
                if (!chip) return;
                const a = noteEl.getBoundingClientRect();
                const b = chip.getBoundingClientRect();
                links.push({
                    noteId: n.id, groupIdx,
                    x1: a.left + a.width / 2 - box.left,
                    y1: a.bottom - box.top,
                    x2: b.left + b.width / 2 - box.left,
                    y2: b.top - box.top
                });
            });
        });

        // Give coincident connections a small, deterministic horizontal offset.
        // The offset is applied independently to links sharing the same note
        // or the same group, which prevents many-to-many connections from
        // visually collapsing into one line while leaving a single connection
        // exactly where it was.
        const assignOffsets = (items, keyFn) => {
            const buckets = new Map();
            items.forEach(item => {
                const key = keyFn(item);
                if (!buckets.has(key)) buckets.set(key, []);
                buckets.get(key).push(item);
            });
            buckets.forEach(bucket => {
                if (bucket.length < 2) return;
                const step = 7;
                const center = (bucket.length - 1) / 2;
                bucket.forEach((item, index) => {
                    const offset = (index - center) * step;
                    item.x1 += offset;
                    item.x2 += offset;
                });
            });
        };
        assignOffsets(links, item => `note:${item.noteId}`);
        assignOffsets(links, item => `group:${item.groupIdx}`);

        links.forEach(({x1, y1, x2, y2}) => {
            const lineEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            lineEl.setAttribute('x1', x1);
            lineEl.setAttribute('y1', y1);
            lineEl.setAttribute('x2', x2);
            lineEl.setAttribute('y2', y2);
            lineEl.setAttribute('stroke', 'currentColor');
            lineEl.setAttribute('stroke-width', '0.3mm');
            lineEl.setAttribute('stroke-linecap', 'round');
            lineEl.setAttribute('opacity', '0.6');
            svg.appendChild(lineEl);
        });
    }

    function setupDetectedNoteDrag(lineIdx, noteEl, visual) {
        let drag = null;
        let lastTapAt = 0;
        const clearTargets = () => visual.querySelectorAll('.note-drop-target').forEach(el => el.classList.remove('note-drop-target'));
        const removeDetectedNote = (id) => {
            const line = state.lines[lineIdx];
            if (!line) return;
            const n = line.detectedNotes?.find(x => x.id === id);
            if (!n) return;
            line.groups.forEach(g => {
                const ids = groupDetectedIds(g).filter(x => x !== id);
                if (ids.length) g._detectedNoteIds = ids;
                else if (groupDetectedIds(g).length) {
                    delete g._detectedNoteIds; delete g._detectedNoteId;
                    g.note = null; g.duration = 0.6;
                }
            });
            line.detectedNotes = line.detectedNotes.filter(x => x.id !== id);
            renderAll();
        };
        const onMove = e => {
            if (!drag) return;
            const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
            if (!drag.moved && Math.hypot(dx, dy) < 5) return;
            drag.moved = true;
            const ghost = drag.ghost;
            ghost.style.left = `${e.clientX - drag.offsetX}px`;
            ghost.style.top = `${e.clientY - drag.offsetY}px`;
            clearTargets();
            const under = document.elementFromPoint(e.clientX, e.clientY);
            const chip = under?.closest?.('.chip');
            if (chip && chip.closest('.line-block')?.dataset.line === String(lineIdx)) chip.classList.add('note-drop-target');
        };
        const finish = e => {
            if (!drag) return;
            const under = document.elementFromPoint(e.clientX, e.clientY);
            const chip = under?.closest?.('.chip');
            clearTargets();
            drag.ghost.remove();
            noteEl.classList.remove('drag-source');
            noteEl.releasePointerCapture?.(e.pointerId);
            const droppedInsideSameLine = chip && chip.closest('.line-block')?.dataset.line === String(lineIdx);

            // A note is deleted only when it is deliberately carried outside its
            // own line block ("групи слів з нотами"). Dropping it anywhere else
            // inside that block — including empty space between chips — must
            // just return it to its original place, unchanged. This works the
            // same way for mouse, touch and pen via Pointer Events.
            const lineBlockEl = visual.closest('.line-block');
            const blockRect = lineBlockEl ? lineBlockEl.getBoundingClientRect() : null;
            const droppedOutsideBlock = !!blockRect && (
                e.clientX < blockRect.left || e.clientX > blockRect.right ||
                e.clientY < blockRect.top || e.clientY > blockRect.bottom
            );

            if (drag.moved && droppedInsideSameLine) {
                attachDetectedNote(lineIdx, noteEl.dataset.noteId, parseInt(chip.dataset.group));
            } else if (drag.moved && droppedOutsideBlock) {
                removeDetectedNote(noteEl.dataset.noteId);
            }
            // Otherwise (moved but dropped inside the block, off any chip, or
            // not moved at all): do nothing — the note snaps back on its own
            // since it was never removed from the DOM/model, order intact.
            drag = null;
        };
        noteEl.addEventListener('pointerdown', e => {
            e.preventDefault();
            const now = performance.now();
            if (now - lastTapAt < 320) {
                lastTapAt = 0;
                openDetectedNotePopup(lineIdx, noteEl.dataset.noteId);
                return;
            }
            lastTapAt = now;
            const r = noteEl.getBoundingClientRect();
            const ghost = noteEl.cloneNode(true);
            ghost.classList.add('detected-note-drag-ghost');
            Object.assign(ghost.style, { position:'fixed', left:`${r.left}px`, top:`${r.top}px`, width:`${r.width}px`, margin:'0', pointerEvents:'none', zIndex:'9999' });
            document.body.appendChild(ghost);
            noteEl.classList.add('drag-source');
            drag = { startX:e.clientX, startY:e.clientY, offsetX:e.clientX-r.left, offsetY:e.clientY-r.top, moved:false, startedAt:performance.now(), ghost };
        });
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', finish);
        document.addEventListener('pointercancel', finish);
        noteEl.addEventListener('dblclick', e => { e.preventDefault(); e.stopPropagation(); openDetectedNotePopup(lineIdx, noteEl.dataset.noteId); });
    }

    function mergeGroupWithNext(lineIdx, groupIdx) {
        const line = state.lines[lineIdx];
        if (!line || line.isEmpty) return;
        const groups = line.groups;
        if (groupIdx < 0 || groupIdx >= groups.length - 1) return;

        const current = groups[groupIdx];
        const next = groups[groupIdx + 1];
        if (!current || !next) return;

        const mergedWords = [...current.words, ...next.words];
        const note = current.note !== null ? current.note : next.note;
        const mergedNoteIds = [...new Set([...groupDetectedIds(current), ...groupDetectedIds(next)])];

        groups.splice(groupIdx, 2, {
            words: mergedWords,
            note: note,
            duration: (current.duration || 0.6) + (next.duration || 0.6),
            _detectedNoteIds: mergedNoteIds
        });

        syncDetectedNoteLinks(line);
        updateTextareaFromState();
        renderAll();
    }

    function splitGroup(lineIdx, groupIdx) {
        const line = state.lines[lineIdx];
        if (!line || line.isEmpty) return;
        const group = line.groups[groupIdx];
        if (!group) return;
        if (group.words.length <= 1) return;

        const words = group.words;
        const lastWord = words[words.length - 1];
        const restWords = words.slice(0, words.length - 1);
        const note = group.note;
        const noteIds = groupDetectedIds(group);

        line.groups.splice(groupIdx, 1, {
            words: restWords,
            note: note,
            duration: group.duration || 0.6,
            _detectedNoteIds: [...noteIds]
        }, {
            words: [lastWord],
            note: null,
            duration: 0.6,
            _detectedNoteIds: []
        });

        syncDetectedNoteLinks(line);
        updateTextareaFromState();
        renderAll();
    }

    function clearAllGroups() {
        if (!confirm('Ви впевнені, що хочете очистити всі групи та ноти?')) return;
        const text = lyricsInput.value;
        const lines = parseTextToLines(text);
        state.lines = lines.map(line => {
            if (isLineEmpty(line)) {
                return { groups: [], isEmpty: true, collapsed: false, detectedNotes: [] };
            }
            return {
                groups: mergePunctuation(wordsFromLine(line)).map(w => ({
                    words: [w],
                    note: null
                })),
                isEmpty: false,
                rawText: line,
                collapsed: false,
                detectedNotes: []
            };
        });
        renderAll();
    }

    function updateTextareaFromState() {
        lyricsInput.value = state.lines.map(line => line.rawText ?? (line.isEmpty ? '' : line.groups.flatMap(g => g.words).join(' '))).join('\n');
    }

    // ============================================================
    // 8. RENDER
    // ============================================================
    function getGroupId(lineIdx, groupIdx) {
        return `g-${lineIdx}-${groupIdx}`;
    }

    function renderGroups() {
        // A drag ghost is appended straight to document.body so it can float
        // freely over everything. If a drag gets interrupted by a re-render
        // (e.g. another line's recording finishes, or notes are cleared,
        // while a note is mid-drag) its pointerup/pointercancel may never
        // reach the now-replaced note element, leaving the ghost stuck.
        // Rebuilding the groups DOM is a safe point to always clear it out.
        document.querySelectorAll('.detected-note-drag-ghost, .group-drag-ghost').forEach(el => el.remove());

        const container = groupsContainer;
        if (!state.lines.length || state.lines.every(l => l.isEmpty && !l.draft)) {
            container.innerHTML = `<div class="empty-state"><span class="big-icon">📝</span>Вставте текст в поле для тексту пісні, щоб створити групи слів</div>`;
            groupCount.textContent = '0 груп';
            return;
        }

        let totalGroups = 0;
        let html = '';
        let displayLineNumber = 0;
        for (let li = 0; li < state.lines.length; li++) {
            const line = state.lines[li];

            if (line.isEmpty) {
                html += `<div class="line-block-empty"></div>`;
                continue;
            }

            totalGroups += line.groups.length;
            const lineText = line.rawText ?? line.groups.flatMap(g => g.words).join(' ');
            if (lineText.trim()) displayLineNumber++;
            const collapsedClass = line.collapsed ? ' collapsed' : '';

            const draftClass = line.draft ? ' draft' : '';
            html += `<div class="line-block${collapsedClass}${draftClass}" data-line="${li}">`;

            html += `<div class="line-block-header" data-line="${li}">`;
            html += `<button class="collapse-toggle" type="button" tabindex="-1" title="Згорнути/розгорнути рядок">▾</button>`;
            html += `<span class="line-number">${displayLineNumber}</span>`;
            html += `<span class="line-preview">${escapeHtml(lineText)}</span>`;
            html += `</div>`;

            html += `<div class="line-block-body">`;
            html += `<input type="text" class="line-text-input" data-line="${li}" placeholder="Текст рядка">`;
            const notes = line.detectedNotes || [];
            html += `<div class="record-actions">`;
            html += `<button class="record-line-btn" data-line="${li}" type="button">🎙 Додати аудіо</button>`;
            html += `<button class="clear-line-notes-btn" data-clear-line-notes="${li}" type="button">🗑 Видалити всі ноти</button>`;
            html += `<button class="line-notes-toggle" data-toggle-notes="${li}" type="button">♫ Ноти${notes.length ? ` (${notes.length})` : ''} ${line.notesCollapsed ? '▸' : '▾'}</button>`;
            if (line.audioData) html += `<span class="line-audio-badge">● Аудіо проаналізовано</span>`;
            html += `<span class="record-status" data-record-status="${li}"></span>`;
            html += `</div>`;
            const notesCollapsed = line.notesCollapsed ? ' notes-collapsed' : '';
            html += `<div class="line-notes-visual${notesCollapsed}" data-notes-visual="${li}">`;
            html += `<svg class="line-notes-connections" aria-hidden="true"></svg>`;
            html += `<div class="line-notes-strip">`;
            if (notes.length) {
                notes.forEach(n => {
                    html += `<div class="detected-note" data-note-id="${escapeHtml(n.id)}" title="${escapeHtml(n.note)} — ${n.duration.toFixed(2)} с">${escapeHtml(n.note.replace(/\d/, ''))}</div>`;
                });
            } else {
                html += `<div class="line-notes-empty">Після запису тут з’являться визначені ноти</div>`;
            }
            html += `</div>`;
            if (line.groups.length) {
                html += `<div class="chips">`;
                for (let gi = 0; gi < line.groups.length; gi++) {
                    const group = line.groups[gi];
                    const words = group.words;
                    const note = group.note;
                    const displayText = words.join(' ');
                    const hasNote = note !== null;
                    const isLastInLine = gi === line.groups.length - 1;

                    html += `<div class="chip" data-line="${li}" data-group="${gi}">`;
                    html += `<span class="text">${escapeHtml(displayText)}</span>`;

                    const noteDisplay = hasNote ? note.replace(/\d/, '') : '♩';
                    html += `<span class="note-badge ${hasNote ? 'has-note' : ''}" title="${hasNote ? note : 'Тап на слово, щоб вибрати ноту'}">${noteDisplay}</span>`;

                    if (!isLastInLine) {
                        html += `<button class="action-btn merge-btn" data-action="merge" data-line="${li}" data-group="${gi}" title="Об'єднати з наступною групою">+</button>`;
                    }

                    if (group.words.length > 1) {
                        html += `<button class="action-btn split-btn" data-action="split" data-line="${li}" data-group="${gi}" title="Відокремити останнє слово">✂️</button>`;
                    }

                    html += `</div>`;
                }
                html += `</div>`;
            }
            html += `</div>`;
            html += `</div></div>`;
        }

        container.innerHTML = html;
        groupCount.textContent = `${totalGroups} груп`;

        // Values are assigned via JS (not baked into the HTML string) so line
        // text containing quotes/special characters can never break the markup.
        container.querySelectorAll('.line-text-input').forEach(input => {
            const li = parseInt(input.dataset.line);
            const line = state.lines[li];
            input.value = (line && !line.isEmpty) ? (line.rawText ?? line.groups.flatMap(g => g.words).join(' ')) : '';

            // Update groups immediately while typing. Only the groups/preview
            // DOM is refreshed, so this input keeps focus and its caret position.
            input.addEventListener('input', () => {
                let newText = removeLatin(input.value);

                if (input.value !== newText) {
                    const start = input.selectionStart;
                    const cleanedPrefix = cleanLyricsText(input.value.slice(0, start));
                    const newCursorPosition = cleanedPrefix.length;

                    input.value = newText;
                    input.setSelectionRange(newCursorPosition, newCursorPosition);
                }

                handleLineTextLiveEdit(li, input.value);
            });

            input.addEventListener('blur', () => {
                handleLineTextCommit(li, input.value);
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur();
                }
            });
            input.addEventListener('click', (e) => e.stopPropagation());
        });

        container.querySelectorAll('.line-block-header').forEach(header => {
            header.addEventListener('click', () => {
                const li = parseInt(header.dataset.line);
                toggleLineCollapsed(li);
            });
        });

        container.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                if (e.target.closest('.action-btn')) return;
                const line = parseInt(chip.dataset.line);
                const group = parseInt(chip.dataset.group);
                openNotePopup(line, group);
            });
        });

        container.querySelectorAll('.chip').forEach(chip => {
            const li = parseInt(chip.dataset.line, 10);
            const visual = chip.closest('.line-notes-visual');
            if (visual) setupGroupReverseDrag(li, chip, visual);
        });

        container.querySelectorAll('[data-action="merge"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const line = parseInt(btn.dataset.line);
                const group = parseInt(btn.dataset.group);
                mergeGroupWithNext(line, group);
            });
        });

        container.querySelectorAll('[data-action="split"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const line = parseInt(btn.dataset.line);
                const group = parseInt(btn.dataset.group);
                splitGroup(line, group);
            });
        });

        container.querySelectorAll('[data-toggle-notes]').forEach(btn => {
            btn.addEventListener('click', e => {
                e.preventDefault();
                const li = parseInt(btn.dataset.toggleNotes);
                const line = state.lines[li];
                if (!line) return;
                line.notesCollapsed = !line.notesCollapsed;
                renderAll();
            });
        });
        container.querySelectorAll('[data-clear-line-notes]').forEach(btn => {
            btn.addEventListener('click', e => {
                e.preventDefault();
                clearDetectedNotes(parseInt(btn.dataset.clearLineNotes));
            });
        });
        container.querySelectorAll('[data-notes-visual]').forEach(visual => {
            const li = parseInt(visual.dataset.notesVisual);
            visual.querySelectorAll('.detected-note').forEach(noteEl => setupDetectedNoteDrag(li, noteEl, visual));
            requestAnimationFrame(() => renderDetectedNoteConnections(li, visual));
        });
    }


    // ============================================================
    // 8.5 LINE PLAYER
    // ============================================================
    // The player has ONE source of truth: line.detectedNotes.
    // Word groups only provide the visual lyrics that are linked to each note.
    function getLineMelody(lineIdx) {
        const line = state.lines[lineIdx];
        if (!line || !Array.isArray(line.detectedNotes)) return [];
        return line.detectedNotes
            .filter(n => n && n.note && Number.isFinite(Number(n.duration)) && Number(n.duration) > 0)
            .map((n, i) => ({
                id: n.id,
                note: n.note,
                duration: Math.max(0.05, Number(n.duration)),
                // Silence before this note, as detected during recording (or
                // set manually). The pause before the very first note is
                // never played back — see analyzeRecordedPitch — so it's
                // forced to 0 here too, defensively.
                restBefore: i === 0 ? 0 : Math.max(0, Number(n.restBefore) || 0),
                groupIdxs: Array.isArray(n.groupIdxs) ? n.groupIdxs : []
            }));
    }

    // Cumulative timeline for a melody: for each note, where its preceding
    // pause starts, where the note itself starts (after the pause), and
    // where it ends. Used everywhere playback needs to reason about time.
    function melodySlotBounds(melody) {
        let pos = 0;
        return melody.map(n => {
            const restStart = pos;
            const noteStart = pos + n.restBefore;
            const noteEnd = noteStart + n.duration;
            pos = noteEnd;
            return { restStart, noteStart, noteEnd };
        });
    }

    function lineDuration(lineIdx) {
        return getLineMelody(lineIdx).reduce((sum, n) => sum + n.restBefore + n.duration, 0);
    }

    function stopLinePlayback(collapse = true) {
        const pp = state.playerPlayback;
        if (pp.timer) clearTimeout(pp.timer);
        if (pp.raf) cancelAnimationFrame(pp.raf);
        pp.timer = null;
        pp.raf = null;
        stopAllContinuous();
        if (collapse) pp.expanded = null;
        pp.playing = false;
        pp.lineIdx = null;
        pp.elapsed = 0;
        document.querySelectorAll('.player-chip.playing-group').forEach(el => el.classList.remove('playing-group'));
        document.querySelectorAll('.player-line.playing-line').forEach(el => el.classList.remove('playing-line'));
    }

    function findActiveMelodyNote(lineIdx, elapsed) {
        const melody = getLineMelody(lineIdx);
        const bounds = melodySlotBounds(melody);
        for (let i = 0; i < melody.length; i++) {
            // During a note's preceding pause, nothing is "active" — no
            // sound plays and no group should stay highlighted.
            if (elapsed >= bounds[i].noteStart && elapsed < bounds[i].noteEnd) return melody[i];
        }
        return null;
    }

    function setPlayerProgress(lineIdx, elapsed) {
        const line = state.lines[lineIdx];
        if (!line) return;

        const total = lineDuration(lineIdx);
        const clamped = Math.max(0, Math.min(total, Number(elapsed) || 0));
        // NOTE: intentionally NOT writing `clamped` back into
        // state.playerPlayback.elapsed here. This function is also called every
        // animation frame with a wall-clock-interpolated value; persisting that
        // into the baseline (without also resetting startedAt) made the next
        // frame add the same time-since-start on top of an already-advanced
        // baseline, compounding every frame and racing past the melody's total
        // duration almost instantly. Every caller that needs to move the real
        // baseline (playLineFrom, note transitions, seeks) already sets
        // state.playerPlayback.elapsed itself before calling this function.

        const root = playerContainer.querySelector(`.player-line[data-line="${lineIdx}"]`);
        if (!root) return;

        const pct = total > 0 ? (clamped / total) * 100 : 0;
        const progress = root.querySelector('.player-track-progress');
        const dot = root.querySelector('.player-track-dot');
        const current = root.querySelector('.player-current-time');
        if (progress) progress.style.width = `${pct}%`;
        if (dot) dot.style.left = `${pct}%`;
        if (current) current.textContent = formatTime(clamped);

        // A detected note can be linked to several word groups.
        // Every linked group is highlighted while that note is sounding.
        const activeNote = findActiveMelodyNote(lineIdx, clamped);
        const activeId = activeNote?.id || null;
        root.querySelectorAll('.player-chip').forEach(chip => {
            const groupIdx = parseInt(chip.dataset.group, 10);
            const group = line.groups[groupIdx];
            const linked = group && groupDetectedIds(group).includes(activeId);
            chip.classList.toggle('playing-group', !!linked);
        });
    }

    function formatTime(sec) {
        sec = Math.max(0, Number(sec) || 0);
        return `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
    }

    async function playLineFrom(lineIdx, startAt = 0) {
        const line = state.lines[lineIdx];
        const melody = getLineMelody(lineIdx);
        if (!line || !melody.length) return false;

        // The first call is made directly from the user's click, so explicitly
        // resume Web Audio here. No recorded audio blob is used for playback.
        const ctx = getAudioCtx();
        if (ctx.state === 'suspended') {
            try { await ctx.resume(); } catch (e) { console.warn('AudioContext resume failed:', e); }
        }

        stopLinePlayback(false);

        state.playerPlayback.lineIdx = lineIdx;
        state.playerPlayback.expanded = lineIdx;
        state.playerPlayback.playing = true;

        const bounds = melodySlotBounds(melody);
        const total = bounds.length ? bounds[bounds.length - 1].noteEnd : 0;
        const at = Math.max(0, Math.min(Number(startAt) || 0, total));
        state.playerPlayback.elapsed = at;
        state.playerPlayback.startedAt = performance.now();

        const speed = Number(state.playerPlayback.speed) || 1;

        // Find the note whose slot (pause + note) contains the requested
        // start position.
        let noteIndex = bounds.findIndex(b => at < b.noteEnd);
        if (noteIndex === -1) noteIndex = melody.length;

        if (noteIndex < melody.length) {
            const { noteStart, noteEnd } = bounds[noteIndex];
            if (at < noteStart) {
                // The requested position falls inside the pause before this
                // note — wait out the remaining silence, then play the note
                // in full (no sound, no highlight, until the pause ends).
                const restRemaining = noteStart - at;
                state.playerPlayback.timer = setTimeout(
                    () => playMelodyNoteAfterRest(lineIdx, noteIndex),
                    restRemaining * 1000 / speed
                );
            } else {
                const remaining = Math.max(0.05, noteEnd - at);
                playNote(melody[noteIndex].note, remaining / speed);
                state.playerPlayback.timer = setTimeout(
                    () => playNextMelodyNote(lineIdx, noteIndex + 1),
                    remaining * 1000 / speed
                );
            }
        } else {
            state.playerPlayback.playing = false;
            state.playerPlayback.elapsed = total;
        }

        renderPlayer();
        setPlayerProgress(lineIdx, at);
        state.playerPlayback.raf = requestAnimationFrame(playerAnimationFrame);
        return true;
    }

    // Plays a melody note in full, assuming its preceding pause (if any)
    // has already fully elapsed (either because it was 0 or because a
    // setTimeout already waited it out).
    function playMelodyNoteAfterRest(lineIdx, noteIndex) {
        const pp = state.playerPlayback;
        if (!pp.playing || pp.lineIdx !== lineIdx) return;

        const melody = getLineMelody(lineIdx);
        const bounds = melodySlotBounds(melody);
        const b = bounds[noteIndex];
        if (!b) return;

        pp.elapsed = b.noteStart;
        pp.startedAt = performance.now();

        const note = melody[noteIndex];
        const speed = Number(pp.speed) || 1;
        playNote(note.note, note.duration / speed);
        pp.timer = setTimeout(
            () => playNextMelodyNote(lineIdx, noteIndex + 1),
            note.duration * 1000 / speed
        );
    }

    function playNextMelodyNote(lineIdx, noteIdx) {
        const pp = state.playerPlayback;
        if (!pp.playing || pp.lineIdx !== lineIdx) return;

        const melody = getLineMelody(lineIdx);
        if (noteIdx >= melody.length) {
            const total = lineDuration(lineIdx);
            pp.playing = false;
            pp.timer = null;
            pp.elapsed = total;
            setPlayerProgress(lineIdx, total);
            renderPlayer();
            return;
        }

        const bounds = melodySlotBounds(melody);
        const { restStart } = bounds[noteIdx];
        const restBefore = melody[noteIdx].restBefore;
        const speed = Number(pp.speed) || 1;

        // Mark the start of this note's pause right away, so the progress
        // bar and elapsed-time readout keep advancing smoothly through the
        // silence (playerAnimationFrame interpolates from here).
        pp.elapsed = restStart;
        pp.startedAt = performance.now();

        if (restBefore > 0) {
            pp.timer = setTimeout(() => playMelodyNoteAfterRest(lineIdx, noteIdx), restBefore * 1000 / speed);
        } else {
            playMelodyNoteAfterRest(lineIdx, noteIdx);
        }
    }

    function playerAnimationFrame() {
        const pp = state.playerPlayback;
        if (!pp.playing || pp.lineIdx === null) return;

        const elapsed = pp.elapsed + (performance.now() - pp.startedAt) / 1000 * (Number(pp.speed) || 1);
        const total = lineDuration(pp.lineIdx);
        setPlayerProgress(pp.lineIdx, elapsed);

        if (elapsed >= total) {
            const finishedLine = pp.lineIdx;
            if (pp.timer) clearTimeout(pp.timer);
            pp.timer = null;
            pp.playing = false;
            pp.elapsed = total;
            setPlayerProgress(finishedLine, total);
            renderPlayer();
            return;
        }
        pp.raf = requestAnimationFrame(playerAnimationFrame);
    }

    function togglePlayerLine(lineIdx) {
        const melody = getLineMelody(lineIdx);
        if (!melody.length) return;

        const pp = state.playerPlayback;
        if (pp.playing && pp.lineIdx === lineIdx) {
            stopLinePlayback(true);
            renderPlayer();
            return;
        }

        stopLinePlayback(true);
        pp.speed = 1;
        playLineFrom(lineIdx, 0);
    }

    function seekLinePlayer(lineIdx, ratio) {
        const total = lineDuration(lineIdx);
        if (!total) return;
        const at = Math.max(0, Math.min(1, Number(ratio) || 0)) * total;

        if (state.playerPlayback.lineIdx === lineIdx && state.playerPlayback.playing) {
            playLineFrom(lineIdx, at);
        } else {
            stopLinePlayback(false);
            state.playerPlayback.lineIdx = lineIdx;
            state.playerPlayback.expanded = lineIdx;
            state.playerPlayback.elapsed = at;
            renderPlayer();
            setPlayerProgress(lineIdx, at);
        }
    }

    function switchPlayerLine(delta) {
        const current = state.playerPlayback.expanded;
        const candidates = state.lines
            .map((line, i) => ({ line, i }))
            .filter(x => getLineMelody(x.i).length > 0);
        if (!candidates.length) return;

        const currentIndex = candidates.findIndex(x => x.i === current);
        const base = currentIndex >= 0 ? currentIndex : (delta > 0 ? -1 : candidates.length);
        const nextIndex = Math.max(0, Math.min(candidates.length - 1, base + delta));
        const next = candidates[nextIndex];
        if (!next) return;

        playerContainer.querySelector(`.player-line[data-line="${next.i}"]`)
            ?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        playLineFrom(next.i, 0);
    }

    function renderPlayer() {
        const container = playerContainer;
        const linesForPlayer = state.lines
            .map((line, i) => ({ line, i, melody: getLineMelody(i) }))
            .filter(x => !x.line.isEmpty && (x.line.rawText ?? '').trim().length || (!x.line.isEmpty && x.line.groups.length));

        if (!linesForPlayer.length) {
            container.innerHTML = `<div class="empty-state"><span class="big-icon">🎤</span>Немає рядків для тренування. Спочатку створіть рядки в редакторі.</div>`;
            playerGroupCount.textContent = '0 нот';
            return;
        }

        let html = '';
        let totalNotes = 0;

        for (const item of linesForPlayer) {
            const li = item.i;
            const line = item.line;
            const melody = item.melody;
            const expanded = state.playerPlayback.expanded === li;
            totalNotes += melody.length;

            const displayNumber = state.lines
                .slice(0, li + 1)
                .filter(l => !l.isEmpty && ((l.rawText ?? '').trim().length || l.groups.length))
                .length;

            html += `<div class="player-line${state.playerPlayback.lineIdx === li && state.playerPlayback.playing ? ' playing-line' : ''}" data-line="${li}">`;
            html += `<div class="player-line-head">`;
            const hasMelody = melody.length > 0;
            const isPlaying = state.playerPlayback.playing && state.playerPlayback.lineIdx === li;
            html += `<button type="button" class="player-line-play${expanded ? ' expanded' : ''}" data-line-play="${li}" ${hasMelody ? '' : 'disabled'} title="${hasMelody ? 'Програти мелодію рядка' : 'Для цього рядка ще немає записаної мелодії'}">${isPlaying ? '⏸' : '▶'}</button>`;
            html += `<span class="player-line-label">Рядок ${displayNumber}</span>`;
            if (!hasMelody) html += `<span class="line-audio-badge" style="opacity:.55">Немає записаної мелодії</span>`;
            html += `<div class="player-chips">`;

            // Show the lyric groups and the note that is actually linked to them.
            for (let gi = 0; gi < line.groups.length; gi++) {
                const group = line.groups[gi];
                const ids = groupDetectedIds(group);
                const linked = melody.filter(n => ids.includes(n.id));
                const note = linked.length ? linked[linked.length - 1].note : group.note;
                const noteDisplay = note ? note.replace(/\d/, '') : '';
                html += `<div class="player-chip" data-line="${li}" data-group="${gi}" data-note="${note || ''}">`;
                html += `${escapeHtml(group.words.join(' '))}`;
                if (noteDisplay) html += `<span class="note-label">${escapeHtml(noteDisplay)}</span>`;
                html += `</div>`;
            }
            html += `</div></div>`;

            if (expanded) {
                const total = lineDuration(li);
                const elapsed = state.playerPlayback.lineIdx === li ? state.playerPlayback.elapsed : 0;
                const pct = total ? elapsed / total * 100 : 0;
                html += `<div class="player-line-player" data-player="${li}">`;
                html += `<div class="player-track" data-seek-line="${li}"><div class="player-track-progress" style="width:${pct}%"></div><div class="player-track-dot" style="left:${pct}%"></div></div>`;
                html += `<div class="player-time"><span class="player-current-time">${formatTime(elapsed)}</span><span>${formatTime(total)}</span></div>`;
                html += `<div class="player-tools">`;
                html += `<button type="button" class="player-mini-btn" data-prev-line="${li}" title="Попередній рядок">⏮</button>`;
                html += `<button type="button" class="player-mini-btn" data-restart-line="${li}" title="Спочатку">↺</button>`;
                html += `<button type="button" class="player-mini-btn" data-next-line="${li}" title="Наступний рядок">⏭</button>`;
                html += `<div class="player-speed">Швидкість <input type="range" min="0.333" max="1" step="0.001" value="${state.playerPlayback.speed || 1}" data-speed-line="${li}"><span>${(state.playerPlayback.speed || 1).toFixed(2)}×</span></div>`;
                html += `</div></div>`;
            }
            html += `</div>`;
        }

        container.innerHTML = html;
        playerGroupCount.textContent = `${totalNotes} нот`;

        container.querySelectorAll('.player-line-play').forEach(btn => {
            btn.addEventListener('click', e => {
                e.preventDefault();
                e.stopPropagation();
                const li = parseInt(btn.dataset.linePlay, 10);
                if (Number.isInteger(li)) togglePlayerLine(li);
            });
        });

        container.querySelectorAll('[data-prev-line]').forEach(btn => btn.addEventListener('click', () => switchPlayerLine(-1)));
        container.querySelectorAll('[data-next-line]').forEach(btn => btn.addEventListener('click', () => switchPlayerLine(1)));
        container.querySelectorAll('[data-restart-line]').forEach(btn => btn.addEventListener('click', () => {
            const li = parseInt(btn.dataset.restartLine, 10);
            if (Number.isInteger(li)) playLineFrom(li, 0);
        }));

        container.querySelectorAll('[data-speed-line]').forEach(input => input.addEventListener('input', () => {
            const v = parseFloat(input.value);
            state.playerPlayback.speed = v;
            if (input.nextElementSibling) input.nextElementSibling.textContent = v.toFixed(2) + '×';
        }));

        container.querySelectorAll('[data-seek-line]').forEach(track => {
            const seek = e => {
                const r = track.getBoundingClientRect();
                const ratio = r.width ? (e.clientX - r.left) / r.width : 0;
                seekLinePlayer(parseInt(track.dataset.seekLine, 10), ratio);
            };
            track.addEventListener('pointerdown', e => {
                track.setPointerCapture?.(e.pointerId);
                seek(e);
            });
            track.addEventListener('pointermove', e => {
                if (e.buttons) seek(e);
            });
        });

        // Keep manual note preview on the lyric chips. It does not affect the
        // stored melody or the player sequence.
        container.querySelectorAll('.player-chip').forEach(chip => {
            const note = chip.dataset.note;
            const groupId = `${chip.dataset.line}-${chip.dataset.group}`;
            if (!note) {
                chip.style.opacity = '0.65';
                chip.title = 'До цієї групи ноту не прив’язано';
                return;
            }
            const startHold = e => {
                e.preventDefault();
                if (state.holdingId === groupId) return;
                stopAllContinuous();
                state.holdingId = groupId;
                chip.classList.add('holding');
                startContinuousNote(note, groupId);
            };
            const endHold = e => {
                e.preventDefault();
                if (state.holdingId === groupId) {
                    stopContinuousNote(groupId);
                    chip.classList.remove('holding');
                    state.holdingId = null;
                }
            };
            chip.addEventListener('mousedown', startHold);
            chip.addEventListener('mouseup', endHold);
            chip.addEventListener('mouseleave', endHold);
            chip.addEventListener('touchstart', startHold, { passive: false });
            chip.addEventListener('touchend', endHold, { passive: false });
            chip.addEventListener('touchcancel', endHold, { passive: false });
        });

        if (state.playerPlayback.lineIdx !== null && state.playerPlayback.expanded !== null) {
            setPlayerProgress(state.playerPlayback.lineIdx, state.playerPlayback.elapsed);
        }
    }

    function renderAll() {
        if (state.currentTab === 'editor') {
            renderGroups();
        } else {
            renderPlayer();
        }
    }

    // ============================================================
    // 9. NOTE POPUP
    // ============================================================
    let popupLineIdx = null;
    let popupGroupIdx = null;
    let popupDetectedNoteId = null;

    function openDetectedNotePopup(lineIdx, noteId) {
        const line = state.lines[lineIdx];
        const detected = line?.detectedNotes?.find(n => n.id === noteId);
        if (!detected) return;
        popupLineIdx = lineIdx;
        popupGroupIdx = null;
        popupDetectedNoteId = noteId;
        state.tempNote = detected.note;
        noteGrid.innerHTML = '';
        const octaveGroups = [
            { label: 'Мала октава', notes: state.notes.filter(n => n.endsWith('3')) },
            { label: 'Перша октава', notes: state.notes.filter(n => n.endsWith('4')) },
            { label: 'Друга октава', notes: state.notes.filter(n => n.endsWith('5')) }
        ];
        octaveGroups.forEach(group => {
            const labelEl=document.createElement('div'); labelEl.className='octave-label'; labelEl.textContent=group.label; noteGrid.appendChild(labelEl);
            const rowEl=document.createElement('div'); rowEl.className='octave-row';
            group.notes.forEach(n => { const btn=document.createElement('button'); btn.className='note-btn'; if(n===detected.note)btn.classList.add('selected'); btn.textContent=n.replace(/\d/,''); btn.title=n; btn.addEventListener('click',()=>{ state.tempNote=n; saveNoteAndClose(); }); rowEl.appendChild(btn); });
            noteGrid.appendChild(rowEl);
        });
        notePopup.classList.add('open');
    }

    function openNotePopup(lineIdx, groupIdx) {
        const group = getGroup(lineIdx, groupIdx);
        if (!group) return;

        popupLineIdx = lineIdx;
        popupGroupIdx = groupIdx;

        const currentNote = group.note;
        state.tempNote = currentNote || null;

        noteGrid.innerHTML = '';

        const octaveGroups = [
            { label: 'Мала октава', notes: state.notes.filter(n => n.endsWith('3')) },
            { label: 'Перша октава', notes: state.notes.filter(n => n.endsWith('4')) },
            { label: 'Друга октава', notes: state.notes.filter(n => n.endsWith('5')) }
        ];

        octaveGroups.forEach(group => {
            const labelEl = document.createElement('div');
            labelEl.className = 'octave-label';
            labelEl.textContent = group.label;
            noteGrid.appendChild(labelEl);

            const rowEl = document.createElement('div');
            rowEl.className = 'octave-row';

            group.notes.forEach(n => {
                const btn = document.createElement('button');
                btn.className = 'note-btn';
                if (n === currentNote) btn.classList.add('selected');
                btn.textContent = n.replace(/\d/, '');
                btn.title = n;
                btn.dataset.note = n;
                btn.addEventListener('click', () => {
                    state.tempNote = n;
                    saveNoteAndClose();
                });
                rowEl.appendChild(btn);
            });

            noteGrid.appendChild(rowEl);
        });

        notePopup.classList.add('open');
    }

    function closeNotePopup() {
        notePopup.classList.remove('open');
        popupLineIdx = null; popupGroupIdx = null; popupDetectedNoteId = null; state.tempNote = null;
    }

    function saveNoteAndClose() {
        if (popupDetectedNoteId !== null && popupLineIdx !== null) {
            const line=state.lines[popupLineIdx]; const detected=line?.detectedNotes?.find(n=>n.id===popupDetectedNoteId);
            if (detected && state.tempNote) {
                detected.note = state.tempNote;
                const links = Array.isArray(detected.groupIdxs) ? detected.groupIdxs : (detected.groupIdx != null ? [detected.groupIdx] : []);
                links.forEach(gi => {
                    if (line.groups[gi]) {
                        line.groups[gi].note = state.tempNote;
                        line.groups[gi].duration = detected.duration;
                    }
                });
                playNoteOnce(state.tempNote);
                renderAll();
            }
            closeNotePopup(); return;
        }
        if (popupLineIdx === null || popupGroupIdx === null) return;
        setGroupNote(popupLineIdx, popupGroupIdx, state.tempNote); closeNotePopup();
    }

    function removeNoteAndClose() {
        if (popupDetectedNoteId !== null && popupLineIdx !== null) {
            const line=state.lines[popupLineIdx]; if(line) { line.detectedNotes=(line.detectedNotes||[]).filter(n=>n.id!==popupDetectedNoteId); line.groups.forEach(g=>{ const ids=groupDetectedIds(g).filter(id=>id!==popupDetectedNoteId); if(ids.length) g._detectedNoteIds=ids; else if(groupDetectedIds(g).length){delete g._detectedNoteIds; delete g._detectedNoteId; g.note=null; g.duration=0.6;} }); renderAll(); } closeNotePopup(); return;
        }
        if (popupLineIdx === null || popupGroupIdx === null) return;
        state.tempNote = null;
        setGroupNote(popupLineIdx, popupGroupIdx, null);
        closeNotePopup();
    }

    // ============================================================
    // 10. SHARE
    // ============================================================
    function getShareData() {
        const text = lyricsInput.value;
        return {
            t: text,
            g: state.lines.map(line => {
                if (line.isEmpty) return null;
                return {
                    groups: line.groups.map(g => ({
                        w: g.words,
                        n: g.note,
                        d: g.duration || 0.6
                    })),
                    notes: (line.detectedNotes || []).map(n => ({
                        id: n.id,
                        note: n.note,
                        d: n.duration,
                        rb: n.restBefore || 0,
                        gi: Array.isArray(n.groupIdxs) ? n.groupIdxs : (n.groupIdx != null ? [n.groupIdx] : [])
                    }))
                };
            })
        };
    }

    function loadShareData(data) {
        lyricsInput.value = data.t;
        state.lines = data.g.map(lineData => {
            if (lineData === null) {
                return { groups: [], isEmpty: true, collapsed: false, detectedNotes: [] };
            }
            // New format stores groups + detected notes. Legacy format was a plain groups array.
            const groupData = Array.isArray(lineData) ? lineData : (lineData.groups || []);
            const detected = Array.isArray(lineData) ? [] : (lineData.notes || []);
            const groups = groupData.map(g => ({
                words: g.w,
                note: g.n,
                duration: g.d || 0.6
            }));
            const detectedNotes = detected.map((n, i) => ({
                id: n.id || `n-share-${Date.now()}-${i}`,
                note: n.note,
                duration: n.d || 0.6,
                restBefore: i === 0 ? 0 : Math.max(0, Number(n.rb) || 0),
                groupIdxs: Array.isArray(n.gi) ? n.gi.filter(Number.isInteger) : (Number.isInteger(n.gi) ? [n.gi] : [])
            }));
            groups.forEach(g => { delete g._detectedNoteIds; delete g._detectedNoteId; });
            detectedNotes.forEach(n => {
                n.groupIdxs.forEach(gi => {
                    if (!groups[gi]) return;
                    const ids = groupDetectedIds(groups[gi]);
                    if (!ids.includes(n.id)) ids.push(n.id);
                    groups[gi]._detectedNoteIds = ids;
                    groups[gi].note = n.note;
                    groups[gi].duration = n.duration;
                });
            });
            return {
                groups,
                isEmpty: false,
                rawText: groups.flatMap(g=>g.words).join(' '),
                collapsed: false,
                detectedNotes
            };
        });
        renderAll();
    }

    function generateShareUrl() {
        const data = getShareData();
        try {
            const json = JSON.stringify(data);
            const compressed = LZString.compressToEncodedURIComponent(json);
            return window.location.href.split('#')[0] + '#z' + compressed;
        } catch (e) {
            console.error('Share error:', e);
            return null;
        }
    }

    function shareFromPlayer() {
        const url = generateShareUrl();
        if (!url) {
            alert('Помилка створення посилання');
            return;
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => {
                showNotification('✅ Посилання скопійовано!');
            }).catch(() => {
                fallbackCopy(url);
            });
        } else {
            fallbackCopy(url);
        }
    }

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            showNotification('✅ Посилання скопійовано!');
        } catch (e) {
            prompt('Скопіюйте посилання вручну:', text);
        }
        document.body.removeChild(ta);
    }

    function showNotification(msg) {
        shareNotif.textContent = msg;
        shareNotif.classList.add('show');
        clearTimeout(shareNotif._hideTimer);
        shareNotif._hideTimer = setTimeout(() => {
            shareNotif.classList.remove('show');
        }, 3000);
    }

    // ============================================================
    // 11. URL HASH LOADING
    // ============================================================
    function loadFromHash() {
        const hash = window.location.hash.slice(1);
        if (!hash) return false;
        try {
            let json;
            if (hash[0] === 'z') {
                // New compressed format
                json = LZString.decompressFromEncodedURIComponent(hash.slice(1));
            } else {
                // Legacy plain base64 format (old shared links)
                json = decodeURIComponent(atob(hash));
            }
            const data = JSON.parse(json);
            if (data.t !== undefined && data.g !== undefined) {
                loadShareData(data);
                return true;
            }
        } catch (e) {
            console.warn('Failed to load from hash:', e);
        }
        return false;
    }

    // ============================================================
    // 12. UTILITY
    // ============================================================
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============================================================
    // 13. TAB SWITCHING
    // ============================================================
    function switchTab(tabName) {
        state.currentTab = tabName;
        tabBtns.forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tabName);
        });
        Object.keys(screens).forEach(key => {
            screens[key].classList.toggle('active', key === tabName);
        });
        renderAll();
    }

    // ============================================================
    // 13.5 VOLUME CONTROL
    // ============================================================
    function updateVolumeUI(percent) {
        volValue.textContent = percent + '%';
        const max = parseInt(volumeSlider.max, 10) || 100;
        volIcon.textContent = percent == 0 ? '🔇' : (percent < max / 2 ? '🔉' : '🔊');
    }

    function setVolume(percent) {
    state.volume = percent / 100;

    if (state.masterGain) {
        state.masterGain.gain.value = state.volume * 20.0;
    }

    updateVolumeUI(percent);
    }

    // ============================================================
    // 14. INSTRUMENT SELECTOR
    // ============================================================
    function setInstrument(instrument) {
        if (instrument === state.instrument && state.instrumentLoaded) return;
        
        state.instrument = instrument;
        state.instrumentLoaded = false;
        stopAllContinuous();
        
        // Update UI
        document.querySelectorAll('.instrument-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.instrument === instrument);
        });
        
        // Load instrument
        loadInstrument(instrument).then(() => {
            console.log(`✅ Інструмент "${instrument}" готовий до використання`);
        }).catch(() => {
            console.warn(`⚠️ Використовується синтезований звук для "${instrument}"`);
        });
    }

    // ============================================================
    // 15. INIT
    // ============================================================
    function init() {
        const loaded = loadFromHash();

        if (!loaded) {
            lyricsInput.value = '';
            state.lines = [];
        }

        state.lines = (state.lines || []).map(line => {
            const normalized = {
                ...line,
                detectedNotes: line.detectedNotes || [],
                notesCollapsed: !!line.notesCollapsed
            };
            normalized.groups = (normalized.groups || []).map(g => ({
                ...g,
                _detectedNoteIds: groupDetectedIds(g)
            }));
            syncDetectedNoteLinks(normalized);
            return normalized;
        });

        // Restore saved volume (falls back to the 80% default already in state)
        try {
            const savedVolume = localStorage.getItem('vocalTrainerVolume');
            if (savedVolume !== null) {
                const v = parseInt(savedVolume, 10);
                if (!isNaN(v) && v >= 0 && v <= 100) {
                    state.volume = v / 100;
                    volumeSlider.value = v;
                }
            }
        } catch (e) {
            console.warn('Не вдалося прочитати збережену гучність:', e);
        }
        updateVolumeUI(volumeSlider.value);

        if (loaded) {
            // Opened via a share link — jump straight to the exercise screen
            switchTab('player');
        } else {
            renderAll();
        }

        // Auto-load default instrument
        loadInstrument('acoustic_grand_piano').then(() => {
            console.log('✅ Піаніно завантажено');
        });

        // ---- EVENT LISTENERS ----

        volumeSlider.addEventListener('input', () => {
            const v = parseInt(volumeSlider.value, 10);
            setVolume(v);
            try {
                localStorage.setItem('vocalTrainerVolume', v);
            } catch (e) {}
        });

        toggleNotes.addEventListener('change', () => {
            playerContainer.classList.toggle('notes-visible', toggleNotes.checked);
        });

        lyricsInput.addEventListener('input', () => {
            let cleanedText = removeLatin(lyricsInput.value);

            // Filter Latin letters immediately, including pasted text, while
            // preserving the caret position as much as possible.
            if (lyricsInput.value !== cleanedText) {
                const start = lyricsInput.selectionStart;
                const cleanedPrefix = cleanLyricsText(lyricsInput.value.slice(0, start));
                const newCursorPosition = cleanedPrefix.length;

                lyricsInput.value = cleanedText;
                
                lyricsInput.setSelectionRange(newCursorPosition, newCursorPosition);
            }

            // Rebuild immediately so every edit in the main text field is
            // reflected in the line/group blocks without the old 300 ms delay.
            rebuildGroupsPreservingNotes(lyricsInput.value);
            renderAll();
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                switchTab(btn.dataset.tab);
            });
        });

        $('add-line-btn').addEventListener('click', addEmptyLine);
        clearGroupsBtn.addEventListener('click', clearAllGroups);
        groupsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.record-line-btn');
            if (btn) { e.preventDefault(); e.stopPropagation(); toggleLineRecording(parseInt(btn.dataset.line)); }
        });
        backToEditorBtn.addEventListener('click', () => {
            switchTab('editor');
        });
        shareFromPlayerBtn.addEventListener('click', shareFromPlayer);

        popupClose.addEventListener('click', closeNotePopup);
        popupRemoveNote.addEventListener('click', removeNoteAndClose);

        notePopup.addEventListener('click', (e) => {
            if (e.target === notePopup) closeNotePopup();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeNotePopup();
        });

        // Instrument selector
        document.querySelectorAll('.instrument-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setInstrument(btn.dataset.instrument);
            });
        });

        playerContainer.addEventListener('selectstart', e => e.preventDefault());

        window.addEventListener('resize', () => {
            groupsContainer.querySelectorAll('[data-notes-visual]').forEach(visual => {
                renderDetectedNoteConnections(parseInt(visual.dataset.notesVisual), visual);
            });
        });

        window.addEventListener('beforeunload', () => {
            stopAllContinuous();
            if (state.audioCtx) {
                state.audioCtx.close();
            }
        });

        window.addEventListener('hashchange', () => {
            const loadedNow = loadFromHash();
            if (loadedNow) {
                switchTab('player');
            } else {
                renderAll();
            }
        });

        console.log('🎵 Вокальний тренер ініціалізовано');
        console.log('📊 Груп:', state.lines.reduce((acc, l) => acc + (l.isEmpty ? 0 : l.groups.length), 0));
        console.log('🎹 Поточний інструмент:', state.instrument);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>
