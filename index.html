            return;
        }

        let totalGroups = 0;

        state.lines.forEach((line, lineIdx) => {
            if (line.isEmpty) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'line-block-empty';
                groupsContainer.appendChild(emptyDiv);
                return;
            }

            totalGroups += line.groups.length;

            const lineBlock = document.createElement('div');
            lineBlock.className = `line-block ${line.collapsed ? 'collapsed' : ''} ${line.draft ? 'draft' : ''}`;
            lineBlock.dataset.line = lineIdx;

            const lineText = line.rawText ?? line.groups.flatMap(g => g.words).join(' ');

            const header = document.createElement('div');
            header.className = 'line-block-header';
            header.innerHTML = `
                <button class="collapse-toggle" title="Згорнути/розгорнути">▼</button>
                <span class="line-number">Рядок ${lineIdx + 1}</span>
                <span class="line-preview">${escapeHtml(lineText)}</span>
            `;

            header.addEventListener('click', (e) => {
                toggleLineCollapsed(lineIdx);
            });

            const body = document.createElement('div');
            body.className = 'line-block-body';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'line-text-input';
            input.value = lineText;
            input.placeholder = 'Введіть рядок тексту…';
            input.dataset.line = lineIdx;

            input.addEventListener('input', (e) => {
                const val = removeLatin(e.target.value);
                e.target.value = val;
                handleLineTextLiveEdit(lineIdx, val);
            });

            input.addEventListener('change', (e) => {
                const val = removeLatin(e.target.value);
                e.target.value = val;
                handleLineTextCommit(lineIdx, val);
            });

            body.appendChild(input);

            const recActions = document.createElement('div');
            recActions.className = 'record-actions';
            const isRec = state.recording?.lineIdx === lineIdx;
            recActions.innerHTML = `
                <button class="record-line-btn ${isRec ? 'btn-danger' : ''}" data-line="${lineIdx}">
                    ${isRec ? '⏹ Зупинити запис' : '🎤 Записати рядок'}
                </button>
                <span class="record-status ${isRec ? 'recording' : ''}" data-record-status="${lineIdx}">
                    ${isRec ? 'Запис…' : (line.audioData ? 'Аудіо записано' : '')}
                </span>
            `;

            recActions.querySelector('.record-line-btn').addEventListener('click', e => {
                e.stopPropagation();
                toggleLineRecording(lineIdx);
            });

            body.appendChild(recActions);

            if (line.detectedNotes && line.detectedNotes.length > 0) {
                const visual = document.createElement('div');
                visual.className = `line-notes-visual ${line.notesCollapsed ? 'notes-collapsed' : ''}`;
                visual.dataset.line = lineIdx;

                const controls = document.createElement('div');
                controls.className = 'line-notes-controls';
                controls.innerHTML = `
                    <button class="line-notes-toggle" data-line="${lineIdx}">
                        ${line.notesCollapsed ? 'Показати розпізнані ноти' : 'Сховати розпізнані ноти'}
                    </button>
                    <button class="clear-line-notes-btn" data-line="${lineIdx}">
                        Очистити розпізнані ноти
                    </button>
                `;

                controls.querySelector('.line-notes-toggle').addEventListener('click', e => {
                    e.stopPropagation();
                    line.notesCollapsed = !line.notesCollapsed;
                    renderAll();
                });

                controls.querySelector('.clear-line-notes-btn').addEventListener('click', e => {
                    e.stopPropagation();
                    clearDetectedNotes(lineIdx);
                });

                const strip = document.createElement('div');
                strip.className = 'line-notes-strip';

                line.detectedNotes.forEach(n => {
                    const el = document.createElement('div');
                    el.className = 'detected-note';
                    el.dataset.noteId = n.id;
                    el.innerHTML = `${n.note.replace(/\d/, '')}<span class="detected-note-duration">${n.duration.toFixed(1)}s</span>`;
                    setupDetectedNoteDrag(lineIdx, el, visual);
                    strip.appendChild(el);
                });

                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('class', 'line-notes-connections');

                visual.appendChild(controls);
                visual.appendChild(strip);
                visual.appendChild(svg);
                body.appendChild(visual);
            }

            const chips = document.createElement('div');
            chips.className = 'chips';

            line.groups.forEach((group, gi) => {
                const displayText = group.words.join(' ');
                const note = group.note;
                const hasNote = note !== null;
                const isLastInLine = gi === line.groups.length - 1;

                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.dataset.line = lineIdx;
                chip.dataset.group = gi;

                let chipHtml = `<span class="text">${escapeHtml(displayText)}</span>`;
                const noteDisplay = hasNote ? note.replace(/\d/, '') : '♩';
                chipHtml += `<span class="note-badge ${hasNote ? 'has-note' : ''}" title="${hasNote ? escapeHtml(note) : 'Тап на слово, щоб вибрати ноту'}">${noteDisplay}</span>`;

                if (!isLastInLine) {
                    chipHtml += `<button class="action-btn merge-btn" data-action="merge" data-line="${lineIdx}" data-group="${gi}" title="Об'єднати з наступною групою">+</button>`;
                }

                if (group.words.length > 1) {
                    chipHtml += `<button class="action-btn split-btn" data-action="split" data-line="${lineIdx}" data-group="${gi}" title="Відокремити останнє слово">✂️</button>`;
                }

                chip.innerHTML = chipHtml;

                chip.addEventListener('click', (e) => {
                    if (e.target.closest('.action-btn')) return;
                    openNotePopup(lineIdx, gi);
                });

                const mergeBtn = chip.querySelector('[data-action="merge"]');
                if (mergeBtn) {
                    mergeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        mergeGroupWithNext(lineIdx, gi);
                    });
                }

                const splitBtn = chip.querySelector('[data-action="split"]');
                if (splitBtn) {
                    splitBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        splitGroup(lineIdx, gi);
                    });
                }

                chips.appendChild(chip);
            });

            body.appendChild(chips);
            lineBlock.appendChild(header);
            lineBlock.appendChild(body);
            groupsContainer.appendChild(lineBlock);
        });

        groupCount.textContent = `${totalGroups} груп`;

        requestAnimationFrame(() => {
            state.lines.forEach((line, lineIdx) => {
                const visual = groupsContainer.querySelector(`.line-notes-visual[data-line="${lineIdx}"]`);
                if (visual) renderDetectedNoteConnections(lineIdx, visual);
            });
        });
    }

                    e.preventDefault();

                pChip.addEventListener('mousedown', handlePressStart);
                pChip.addEventListener('mouseup', handlePressEnd);
                pChip.addEventListener('mouseleave', handlePressEnd);

                pChip.addEventListener('touchstart', handlePressStart, { passive: false });
                pChip.addEventListener('touchend', handlePressEnd);
                pChip.addEventListener('touchcancel', handlePressEnd);

                chipsDiv.appendChild(pChip);

        playerGroupCount.textContent = `${totalGroups} груп`;

    // ============================================================
    // 9. PLAYER SCREEN AUTOMATIC PLAYBACK
    // ============================================================
    function calculateLineDuration(lineIdx) {
        const line = state.lines[lineIdx];
        if (!line || line.isEmpty) return 0;
        return line.groups.reduce((sum, g) => sum + (g.note ? (g.duration || 0.6) : 0.3), 0);
    }

    function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startLinePlayback(lineIdx) {
        stopLinePlayback();

        const line = state.lines[lineIdx];
        if (!line || line.isEmpty) return;

        state.playerPlayback.lineIdx = lineIdx;
        state.playerPlayback.playing = true;
        state.playerPlayback.expanded = lineIdx;
        state.playerPlayback.elapsed = 0;
        state.playerPlayback.startedAt = performance.now();

        renderPlayerScreen();

        const totalDur = calculateLineDuration(lineIdx);
        const durEl = $(`player-dur-time-${lineIdx}`);
        if (durEl) durEl.textContent = formatTime(totalDur);

        const lineEl = playerContainer.querySelector(`.player-line[data-line="${lineIdx}"]`);
        if (lineEl) lineEl.classList.add('playing-line');

        scheduleNextGroupNote();
        updatePlaybackUI();
    }

    function scheduleNextGroupNote() {
        if (!state.playerPlayback.playing) return;

        const lineIdx = state.playerPlayback.lineIdx;
        const line = state.lines[lineIdx];
        if (!line) return;

        let currentTime = 0;

        for (let gi = 0; gi < line.groups.length; gi++) {
            const group = line.groups[gi];
            const dur = group.note ? (group.duration || 0.6) : 0.3;
            const scaledDur = dur / state.playerPlayback.speed;

            if (currentTime + scaledDur > state.playerPlayback.elapsed) {
                const delay = Math.max(0, (currentTime - state.playerPlayback.elapsed) * 1000);

                state.playerPlayback.timer = setTimeout(() => {
                    if (!state.playerPlayback.playing) return;

                    playerContainer.querySelectorAll('.player-chip').forEach(c => c.classList.remove('playing-group'));
                    const chip = playerContainer.querySelector(`.player-chip[data-line="${lineIdx}"][data-group="${gi}"]`);
                    if (chip) chip.classList.add('playing-group');

                    if (group.note) {
                        playNote(group.note, dur / state.playerPlayback.speed);
                    }

                    state.playerPlayback.timer = setTimeout(() => {
                        if (chip) chip.classList.remove('playing-group');
                    }, scaledDur * 1000);

                }, delay);

                break;
            }

            currentTime += scaledDur;
        }
    }

    function updatePlaybackUI() {
        if (!state.playerPlayback.playing) return;

        const lineIdx = state.playerPlayback.lineIdx;
        const totalDur = calculateLineDuration(lineIdx) / state.playerPlayback.speed;

        const now = performance.now();
        const delta = (now - state.playerPlayback.startedAt) / 1000;
        state.playerPlayback.elapsed += delta;
        state.playerPlayback.startedAt = now;

        if (state.playerPlayback.elapsed >= totalDur) {
            stopLinePlayback();
            return;
        }

        const pct = Math.min(100, (state.playerPlayback.elapsed / totalDur) * 100);

        const progressEl = $(`player-progress-${lineIdx}`);
        const dotEl = $(`player-dot-${lineIdx}`);
        const curTimeEl = $(`player-cur-time-${lineIdx}`);

        if (progressEl) progressEl.style.width = `${pct}%`;
        if (dotEl) dotEl.style.left = `${pct}%`;
        if (curTimeEl) curTimeEl.textContent = formatTime(state.playerPlayback.elapsed * state.playerPlayback.speed);

        state.playerPlayback.raf = requestAnimationFrame(updatePlaybackUI);
    }

    function pauseLinePlayback() {
        if (!state.playerPlayback.playing) return;
        state.playerPlayback.playing = false;
        clearTimeout(state.playerPlayback.timer);
        cancelAnimationFrame(state.playerPlayback.raf);
        renderPlayerScreen();
    }

    function resumeLinePlayback() {
        if (state.playerPlayback.lineIdx === null) return;
        state.playerPlayback.playing = true;
        state.playerPlayback.startedAt = performance.now();
        scheduleNextGroupNote();
        updatePlaybackUI();
        renderPlayerScreen();
    }

    function stopLinePlayback() {
        clearTimeout(state.playerPlayback.timer);
        cancelAnimationFrame(state.playerPlayback.raf);

        if (state.playerPlayback.lineIdx !== null) {
            const lineEl = playerContainer.querySelector(`.player-line[data-line="${state.playerPlayback.lineIdx}"]`);
            if (lineEl) lineEl.classList.remove('playing-line');
        }

        state.playerPlayback.playing = false;
        state.playerPlayback.lineIdx = null;
        state.playerPlayback.expanded = null;
        state.playerPlayback.elapsed = 0;

        playerContainer.querySelectorAll('.player-chip').forEach(c => c.classList.remove('playing-group'));

        renderPlayerScreen();
    }

    // ============================================================
    // 10. NOTE POPUP & SELECTION
    // ============================================================
    function renderNoteGrid() {
        noteGrid.innerHTML = '';

        const octaves = [
            { name: 'Мала октава (3)', notes: state.notes.slice(0, 12) },
            { name: 'Перша октава (4)', notes: state.notes.slice(12, 24) },
            { name: 'Друга октава (5)', notes: state.notes.slice(24, 36) }
        ];

        octaves.forEach(oct => {
            const label = document.createElement('div');
            label.className = 'octave-label';
            label.textContent = oct.name;
            noteGrid.appendChild(label);

            const row = document.createElement('div');
            row.className = 'octave-row';

            oct.notes.forEach(note => {
                const btn = document.createElement('button');
                btn.className = `note-btn ${state.tempNote === note ? 'selected' : ''}`;
                btn.textContent = note.replace(/\d/, '');
                btn.dataset.note = note;

                btn.addEventListener('click', () => {
                    state.tempNote = note;
                    playNoteOnce(note);

                    noteGrid.querySelectorAll('.note-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');

                    setTimeout(() => {
                        applySelectedNote();
                    }, 180);
                });

                row.appendChild(btn);
            });

            noteGrid.appendChild(row);
        });
    }

    function openNotePopup(lineIdx, groupIdx) {
        state.editing = { type: 'group', lineIdx, groupIdx };
        const g = getGroup(lineIdx, groupIdx);
        state.tempNote = g ? g.note : null;

        renderNoteGrid();
        notePopup.classList.add('open');
    }

    function closeNotePopup() {
        notePopup.classList.remove('open');
        state.editing = null;
        state.tempNote = null;
    }

    function applySelectedNote() {
        if (!state.editing) return;
        if (state.editing.type === 'detected') {
            const line = state.lines[state.editing.lineIdx];
            const item = line?.detectedNotes?.find(n => n.id === state.editing.noteId);
            if (item && state.tempNote) {
                item.note = state.tempNote;
                (item.groupIdxs || []).forEach(gi => {
                    const g = line.groups[gi];
                    if (g) g.note = state.tempNote;
                });
                playNoteOnce(state.tempNote);
                renderAll();
            }
        } else {
            setGroupNote(state.editing.lineIdx, state.editing.groupIdx, state.tempNote);
        }
        closeNotePopup();
    }

    function removeSelectedNote() {
        if (!state.editing) return;
        if (state.editing.type === 'detected') {
            detachDetectedNote(state.editing.lineIdx, state.editing.noteId);
        } else {
            setGroupNote(state.editing.lineIdx, state.editing.groupIdx, null);
        }
        closeNotePopup();
    }

    // ============================================================
    // 11. SHARING & URL STATE
    // ============================================================
    function serializeState() {
        const compact = {
            v: 1,
            l: state.lines.map(line => ({
                e: line.isEmpty ? 1 : 0,
                r: line.rawText || '',
                g: line.groups.map(g => [g.words, g.note, g.duration || 0.6, groupDetectedIds(g)])
            }))
        };
        const json = JSON.stringify(compact);
        return LZString.compressToEncodedURIComponent(json);
    }

    function deserializeState(hash) {
        try {
            const json = LZString.decompressFromEncodedURIComponent(hash);
            if (!json) return false;
            const data = JSON.parse(json);
            if (data && data.l) {
                state.lines = data.l.map(line => {
                    if (line.e) return { groups: [], isEmpty: true, rawText: line.r || '' };
                    return {
                        isEmpty: false,
                        rawText: line.r || '',
                        groups: line.g.map(g => ({
                            words: g[0],
                            note: g[1],
                            duration: g[2] || 0.6,
                            _detectedNoteIds: Array.isArray(g[3]) ? g[3] : []
                        }))
                    };
                });
                updateTextareaFromState();
                renderAll();
                return true;
            }
        } catch (e) {
            console.error('Failed to parse share URL:', e);
        }
        return false;
    }

    function copyShareLink() {
        const hash = serializeState();
        const url = `${window.location.origin}${window.location.pathname}#${hash}`;

        navigator.clipboard.writeText(url).then(() => {
            shareNotif.classList.add('show');
            setTimeout(() => {
                shareNotif.classList.remove('show');
            }, 2500);
        }).catch(() => {
            prompt('Скопіюйте посилання вручну:', url);
        });
    }

    // ============================================================
    // 12. TAB NAVIGATION & GENERAL RENDER
    // ============================================================
    function switchTab(tabName) {
        state.currentTab = tabName;

        tabBtns.forEach(btn => {
            if (btn.dataset.tab === tabName) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        Object.keys(screens).forEach(key => {
            if (key === tabName) screens[key].classList.add('active');
            else screens[key].classList.remove('active');
        });

        if (tabName === 'player') {
            renderPlayerScreen();
        } else {
            stopLinePlayback();
            renderGroups();
        }
    }

    function renderAll() {
        if (state.currentTab === 'editor') {
            renderGroups();
        } else {
            renderPlayerScreen();
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============================================================
    // 13. EVENT LISTENERS & INIT
    // ============================================================
    function initEvents() {
        lyricsInput.addEventListener('input', (e) => {
            clearTimeout(state.debounceTimer);
            const rawVal = e.target.value;
            const cleanedVal = removeLatin(rawVal);

            if (rawVal !== cleanedVal) {
                const start = e.target.selectionStart;
                const end = e.target.selectionEnd;
                const diff = rawVal.length - cleanedVal.length;
                e.target.value = cleanedVal;
                e.target.setSelectionRange(Math.max(0, start - diff), Math.max(0, end - diff));
            }

            state.debounceTimer = setTimeout(() => {
                rebuildGroupsPreservingNotes(e.target.value);
                renderAll();
            }, 120);
        });

        $('add-line-btn').addEventListener('click', () => {
            addEmptyLine();
        });

        clearGroupsBtn.addEventListener('click', () => {
            if (confirm('Дійсно очистити весь текст та ноти?')) {
                clearAllGroups();
            }
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                switchTab(btn.dataset.tab);
            });
        });

        backToEditorBtn.addEventListener('click', () => {
            switchTab('editor');
        });

        shareFromPlayerBtn.addEventListener('click', () => {
            copyShareLink();
        });

        popupClose.addEventListener('click', closeNotePopup);
        popupRemoveNote.addEventListener('click', removeSelectedNote);

        notePopup.addEventListener('click', (e) => {
            if (e.target === notePopup) closeNotePopup();
        });

        volumeSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            state.volume = val / 100;

            volValue.textContent = `${val}%`;
            if (val === 0) volIcon.textContent = '🔇';
            else if (val < 50) volIcon.textContent = '🔉';
            else volIcon.textContent = '🔊';

            updateMasterVolume();
        });

        toggleNotes.addEventListener('change', (e) => {
            if (e.target.checked) {
                playerContainer.classList.add('notes-visible');
            } else {
                playerContainer.classList.remove('notes-visible');
            }
        });

        document.querySelectorAll('.instrument-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const inst = btn.dataset.instrument;
                if (state.instrument === inst) return;

                document.querySelectorAll('.instrument-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                state.instrument = inst;
                state.instrumentLoaded = false;

                try {
                    await loadInstrument(inst);
                } catch (e) {
                    console.error('Failed to load instrument:', e);
                }
            });
        });

        window.addEventListener('resize', () => {
            if (state.currentTab === 'editor') {
                state.lines.forEach((line, lineIdx) => {
                    const visual = groupsContainer.querySelector(`.line-notes-visual[data-line="${lineIdx}"]`);
                    if (visual) renderDetectedNoteConnections(lineIdx, visual);
                });
            }
        });
    }

    function init() {
        initEvents();

        if (window.location.hash && window.location.hash.length > 1) {
            const hash = window.location.hash.substring(1);
            if (deserializeState(hash)) {
                console.log('✅ Данні успішно завантажено з посилання');
            }
        }

        loadInstrument('acoustic_grand_piano').catch(console.error);

        renderAll();
    }

    init();

})();
</script>
